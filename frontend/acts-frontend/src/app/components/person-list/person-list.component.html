<h2>People</h2>

<!-- Add new person -->
<div class="toolbar">
  <input
    type="text"
    [(ngModel)]="newPersonName"
    placeholder="Enter name"
    class="input"
  />
  <button (click)="addPerson()" class="btn btn-primary">Add Person</button>
  <button (click)="viewPersonByName()" class="btn btn-secondary">View Person</button>
</div>

<!-- Loading & error messages -->
<div *ngIf="loading" class="skeleton"></div>
<div *ngIf="error" class="error">{{ error }}</div>

<!-- People list -->
<table *ngIf="!loading && people?.length" class="table">
  <thead>
    <tr>
      <th>ID</th>
      <th>Name</th>
      <th>Created</th>
      <th></th>
    </tr>
  </thead>
  <tbody>
    <tr *ngFor="let person of people; let odd = odd" [class.odd]="odd">
      <td>{{ person.personId }}</td>
      <td>{{ person.name }}</td>
      <td>{{ person.createdAt | date }}</td>
      <td>
        <button (click)="viewPerson(person.personId)" class="btn btn-primary btn-sm">View</button>
      </td>
    </tr>
  </tbody>
</table>

<!-- Person detail -->
<div *ngIf="selectedPerson" class="detail-card">
  <h3>Person Details</h3>
  <p><strong>ID:</strong> {{ selectedPerson.personId }}</p>
  <p><strong>Created:</strong> {{ selectedPerson.createdAt | date }}</p>
  <p><strong>Updated:</strong> {{ selectedPerson.updatedAt | date }}</p>
  <div class="toolbar">
    <label class="label">Name:</label>
    <input type="text" [(ngModel)]="selectedPerson.name" class="input" />
    <button (click)="updatePerson()" class="btn btn-success">Change</button>
  </div>
  <button (click)="selectedPerson = null" class="btn btn-secondary">Close</button>
</div>
